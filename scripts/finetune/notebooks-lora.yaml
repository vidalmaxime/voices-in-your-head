# Balanced English Weil/Camus notebook completion SFT. Outputs stay in /data/.
model: "data/models/lfm2.5-350m-base"
train: true
fine_tune_type: "lora"
data: "data/notebooks"
adapter_path: "data/notebooks/adapters"
seed: 42
# ~1 epoch of the 7,320-row training set at batch 4.
iters: 1800
batch_size: 4
learning_rate: 1.0e-4
steps_per_report: 25
steps_per_eval: 200
val_batches: -1
save_every: 200
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
num_layers: -1
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0
